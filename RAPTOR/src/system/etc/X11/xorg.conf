# /etc/X11/xorg.conf - Tegra (nvidia) driver, headless console.
#
# Installed by src/setup/set_headless_display.sh, which keeps the stock file at
# /etc/X11/xorg.conf.pre-headless and restores it automatically if X fails.
# To revert by hand: copy that file back and `sudo systemctl restart gdm3`.
#
# What this actually achieves on this board: 1024x768, NOT the 1920x1080 asked
# for below. With no monitor there is no EDID, and the Tegra display stack falls
# back to a built-in mode despite every validation override here. Reaching 1080p
# would need a synthetic EDID blob (Option "CustomEDID"). Without the
# ConnectedMonitor line the console comes up at 640x480, too small for the demo.

Section "Module"
    Disable     "dri"
    SubSection  "extmod"
        Option  "omit xfree86-dga"
    EndSubSection
EndSection

Section "Monitor"
    Identifier   "HeadlessMonitor"
    HorizSync    28.0-80.0
    VertRefresh  48.0-75.0
    # CEA-861 1920x1080p60 timings.
    Modeline "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option       "DPMS" "false"
EndSection

Section "Device"
    Identifier  "Tegra0"
    Driver      "nvidia"
    Option      "AllowEmptyInitialConfiguration" "true"
    # Pretend HDMI-0 is plugged in so a mode can be set with no display present.
    Option      "ConnectedMonitor" "HDMI-0"
    # With no monitor there is no EDID, so the driver rejects the modeline and
    # falls back to a built-in mode. Turn EDID validation off entirely.
    Option      "UseEdid" "false"
    Option      "ExactModeTimingsDVI" "true"
    Option      "ModeValidation" "HDMI-0: AllowNonEdidModes, NoEdidModes, NoVesaModes, NoMaxSizeCheck, NoMaxPClkCheck, NoEdidMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoDFPNativeResolutionCheck"
EndSection

Section "Screen"
    Identifier  "HeadlessScreen"
    Device      "Tegra0"
    Monitor     "HeadlessMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection

bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    # delivery: 10 -> 50 ms and 20 -> 1000 ms. With 20 ms the tree gave up with "Timed out while waiting for action server
    # to acknowledge goal" on the busy Pi and failed the goal while driving was fine (simulator on the robot, 2026-11-05).
    bt_loop_duration: 50
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # delivery: 20 -> 10 Hz, enough at 0.20 m/s and within the Pi's means.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    # delivery: topic on which the SpeedFilter (global costmap) publishes nav2_msgs/SpeedLimit; the controller
    # delivery: server subscribes to it and scales the controller's speed. Upstream default is the relative name
    # delivery: "speed_limit"; the absolute name is written so both sides are explicit. This parameter exists in
    # delivery: Nav2 Jazzy controller_server (fact sheet, verified from source 2026-11-03).
    speed_limit_topic: "/speed_limit"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # delivery: Regulated Pure Pursuit instead of MPPI. On the Pi 4 MPPI (2000 samples at 20 Hz) missed its loop rate
    # all the time and kept the CPU at 100 %, and Nav2 then gave up with "Failed to make progress" (simulator run on the
    # robot, 2026-11-05). This controller costs little CPU and follows the planned lane closely, which is the point here.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20              # delivery: the speed cap
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.5              # delivery: the Pi can be late
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false   # delivery: the soft lane mask must not slow the robot down
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      allow_reversing: false                # delivery: never reverse on its own with food on board
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.06
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      # delivery: costmap filters go in their own "filters" list (Nav2 docs), not in "plugins". They run AFTER
      # delivery: all layers including inflation, so the keepout lines are not widened by inflation and the
      # delivery: static/obstacle layers stay first. (The brief said "before inflation"; the Nav2 convention is after.)
      filters: ["keepout_filter"]
      keepout_filter:
        # delivery: keepout filter, mask served on /keepout_filter_mask, info on /keepout_filter_info
        # delivery: by launch/delivery_stack.launch.py. Copies mask cost into the costmap when higher.
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # delivery: inflation_radius 0.45 -> 0.35, cost_scaling_factor 4.0 -> 6.0 (was 4.0 / 0.45).
        # delivery: cost = 252 * exp(-k * (d - r_inscribed)) for r_inscribed < d <= inflation_radius, 0 beyond.
        # delivery: TB4 footprint (octagon below): r_inscribed = shortest centre-to-edge distance = 0.175 m.
        # delivery: Computed costs, new (k=6, R=0.35) vs old (k=4, R=0.45), robot centre at distance d from a wall:
        # delivery:   d=0.25 m: 160 vs 187    d=0.30 m: 119 vs 153    d=0.35 m: 88 vs 125
        # delivery:   d=0.50 m: 0 vs 0 (outside the inflation radius in both; the formula would give 21 / 0.6 at 0.5 m)
        # delivery: So a 0.5 m wall distance already costs 0 either way; the change makes the cost fall off sooner
        # delivery: (steeper), leaving more room for the soft preferred-lane mask to decide where the robot drives.
        cost_scaling_factor: 6.0
        inflation_radius: 0.35
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # delivery: absolute name. In one process the launch remap to /scan does not reach the inner costmap node.
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      resolution: 0.06
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # delivery: costmap filters go in their own "filters" list (Nav2 docs), applied after the layers above.
      filters: ["keepout_filter", "speed_filter"]
      keepout_filter:
        # delivery: lethal lines across the glass-room opening and glass doors, soft preferred-lane band.
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_filter_info"
      speed_filter:
        # delivery: slow zones (ramps, cables). Publishes the limit on speed_limit_topic; the controller_server
        # delivery: reads it. NOT VERIFIED: the parameter name speed_limit_topic for SpeedFilter is taken from the
        # delivery: Nav2 docs; its source (speed_filter.cpp) was not among the downloaded reference files.
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: "/speed_filter_info"
        speed_limit_topic: "/speed_limit"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          # delivery: absolute name. In one process the launch remap to /scan does not reach the inner costmap node.
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # delivery: inflation_radius 0.45 -> 0.35, cost_scaling_factor 4.0 -> 6.0 (was 4.0 / 0.45).
        # delivery: cost = 252 * exp(-k * (d - r_inscribed)) for r_inscribed < d <= inflation_radius, 0 beyond.
        # delivery: TB4 footprint (octagon below): r_inscribed = shortest centre-to-edge distance = 0.175 m.
        # delivery: Computed costs, new (k=6, R=0.35) vs old (k=4, R=0.45), robot centre at distance d from a wall:
        # delivery:   d=0.25 m: 160 vs 187    d=0.30 m: 119 vs 153    d=0.35 m: 88 vs 125
        # delivery:   d=0.50 m: 0 vs 0 (outside the inflation radius in both; the formula would give 21 / 0.6 at 0.5 m)
        # delivery: So a 0.5 m wall distance already costs 0 either way; the change makes the cost fall off sooner
        # delivery: (steeper), leaving more room for the soft preferred-lane mask to decide where the robot drives.
        cost_scaling_factor: 6.0
        inflation_radius: 0.35
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # delivery: cap speed at 0.20 m/s and 0.8 rad/s, gentle acceleration (about 0.3 m/s^2) so food does not spill.
    # delivery: max_velocity [0.26,0,1.0] -> [0.20,0,0.8]; min_velocity [-0.26,0,-1.0] -> [-0.10,0,-0.8];
    # delivery: max_accel [2.5,0,3.2] -> [0.3,0,1.0]; max_decel [-2.5,0,-3.2] -> [-0.5,0,-1.5].
    max_velocity: [0.20, 0.0, 0.8]
    min_velocity: [-0.10, 0.0, -0.8]
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    # delivery: 0.2 -> 0.5 s and 1 -> 2 s. Under load the collision monitor stopped the robot on late data, not on obstacles.
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
